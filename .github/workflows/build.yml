name: Build

# Checks every branch except main. Pushes to main are checked by the deploy
# workflow, which lints and builds before it publishes the demo.
on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for linter errors
        run: pnpm lint

      - name: Build addon
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
