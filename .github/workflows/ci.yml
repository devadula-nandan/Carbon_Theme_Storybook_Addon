name: CI

# Lints and builds every push. On main it then publishes the demo Storybook to
# GitHub Pages.
on:
  push:
  # The Release workflow starts this itself, because a push made with a
  # workflow's own token does not trigger other workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for linter errors
        run: pnpm lint

      - name: Build addon
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload the demo for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and never cancel one that is under way.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    # Deploying into the github-pages environment is what makes GitHub record
    # the deployment, so the repository page shows when the site last changed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
