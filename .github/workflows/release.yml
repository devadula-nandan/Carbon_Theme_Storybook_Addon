name: Release

# Run by hand from the Actions tab: pick how to bump the version, and the
# workflow publishes that version to npm and tags it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

run-name: Release (${{ inputs.bump }})

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # start the Pages deploy and the GitHub Packages mirror once the release is out
  actions: write
  # push the version commit and tag, and create the GitHub release
  contents: write
  # lets this workflow prove to npm who it is, in place of an access token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # main carries the latest Storybook major and is what npm's "latest" should be
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # npm's trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Check for linter errors
        run: pnpm lint

      - name: Bump the version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --message "Release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build addon
        run: pnpm build

      # Publishing comes before pushing: if it fails, the version commit and
      # tag only ever existed in this run and there is nothing to clean up.
      #
      # There is no token here. npm is set up to trust this workflow (a
      # "trusted publisher" in the package's settings on npmjs.com), and it
      # attaches provenance by itself.
      - name: Publish to npm
        run: npm publish

      - name: Push the version commit and tag
        run: git push --atomic origin "HEAD:${{ github.ref_name }}" "v${{ steps.version.outputs.version }}"

      - name: Create the GitHub release
        run: gh release create "v${{ steps.version.outputs.version }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # The push above was made with this workflow's token, which does not
      # trigger other workflows, so the two follow-ups are started explicitly.
      - name: Refresh the live demo
        run: gh workflow run deploy-storybook.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mirror the release to GitHub Packages
        run: gh workflow run github-packages.yml --ref "${{ github.ref_name }}" -f tag="v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
